syntax = "proto3";

package room;

service RoomService {
  rpc GetRoom (RoomRequest) returns (RoomResponse);
  rpc ListRooms (Empty) returns (RoomList);
}

message Empty {}

message RoomRequest {
  string id = 1;
}

message RoomResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  double price_per_night = 4;
}

message RoomList {
  repeated RoomResponse rooms = 1;
}